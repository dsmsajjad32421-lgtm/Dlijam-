<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dli World</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050510;
  font-family:Arial,sans-serif;
  color:white;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

/* OPENING */
#opening{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 40%,#151044 0%,#070713 45%,#020207 100%);
  z-index:10;
  transition:opacity .8s;
}

.logo{
  font-size:54px;
  font-weight:900;
  letter-spacing:14px;
  background:linear-gradient(90deg,#ff39b9,#9d8cff,#00eaff);
  -webkit-background-clip:text;
  color:transparent;
  text-align:center;
}

.sub{
  margin-top:20px;
  color:#00dfff;
  font-size:14px;
  letter-spacing:7px;
  text-align:center;
}

.loading{
  width:80%;
  max-width:550px;
  margin-top:70px;
}

.bar{
  height:6px;
  background:#242431;
  border-radius:20px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff39b9,#8b7cff,#00eaff);
  transition:width .2s;
}

.starting{
  margin-top:22px;
  color:#777;
  letter-spacing:5px;
  text-align:center;
}

/* MENU */
#menu{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  background:
    radial-gradient(circle at 50% 20%,#17104b 0%,#070713 42%,#020207 100%);
  padding:55px 20px 30px;
  overflow:auto;
}

.menu-logo{
  font-size:18px;
  font-weight:bold;
  letter-spacing:8px;
  color:#00eaff;
  margin-bottom:8px;
}

.menu-title{
  font-size:48px;
  font-weight:900;
  letter-spacing:10px;
  background:linear-gradient(90deg,#ff39b9,#a48cff,#00eaff);
  -webkit-background-clip:text;
  color:transparent;
  text-align:center;
}

.line{
  width:90px;
  height:3px;
  margin:18px auto 35px;
  background:linear-gradient(90deg,#ff39b9,#00eaff);
  border-radius:10px;
}

.buttons{
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu-btn{
  width:100%;
  min-height:58px;
  border:1px solid #30305c;
  border-radius:14px;
  background:rgba(18,18,38,.9);
  color:white;
  font-size:17px;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 0 18px rgba(0,220,255,.08);
  transition:.2s;
}

.menu-btn:hover,
.menu-btn:active{
  transform:scale(.98);
  border-color:#00eaff;
  box-shadow:0 0 25px rgba(0,234,255,.25);
}

.play{
  background:linear-gradient(90deg,#b51c91,#3548d8);
  border:none;
  box-shadow:0 0 30px rgba(180,40,220,.3);
  font-size:19px;
}

.footer{
  margin-top:auto;
  padding-top:35px;
  color:#55556b;
  font-size:11px;
  letter-spacing:3px;
  text-align:center;
}

@media(max-width:500px){
  .logo{
    font-size:40px;
    letter-spacing:9px;
  }

  .menu-title{
    font-size:38px;
    letter-spacing:7px;
  }

  .sub{
    font-size:11px;
    letter-spacing:4px;
  }

  #menu{
    padding-top:45px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- OPENING SCREEN -->
  <section id="opening">

    <div class="logo">DLI WORLD</div>

    <div class="sub">
      OPEN WORLD • MULTIPLAYER • NEON
    </div>

    <div class="loading">
      <div class="bar">
        <div class="progress" id="progress"></div>
      </div>

      <div class="starting" id="starting">
        Starting...
      </div>
    </div>

  </section>


  <!-- MAIN MENU -->
  <section id="menu">

    <div class="menu-logo">
      DLICOM
    </div>

    <div class="menu-title">
      DLI WORLD
    </div>

    <div class="line"></div>

    <div class="buttons">

      <button class="menu-btn play" onclick="playGame()">
        🎮 PLAY
      </button>

      <button class="menu-btn" onclick="login()">
        🔐 LOGIN / REGISTER
      </button>

      <button class="menu-btn" onclick="profile()">
        👤 PROFILE
      </button>

      <button class="menu-btn" onclick="leaderboard()">
        🏆 LEADERBOARD
      </button>

      <button class="menu-btn" onclick="settings()">
        ⚙️ SETTINGS
      </button>

    </div>

    <div class="footer">
      DLICOM • DLI WORLD
    </div>

  </section>

</div>


<script>

const opening = document.getElementById("opening");
const menu = document.getElementById("menu");
const progress = document.getElementById("progress");
const starting = document.getElementById("starting");

let value = 0;

const loading = setInterval(() => {

  value += 2;

  progress.style.width = value + "%";

  if(value >= 100){

    clearInterval(loading);

    starting.textContent = "READY";

    setTimeout(() => {

      opening.style.opacity = "0";

      setTimeout(() => {

        opening.style.display = "none";
        menu.style.display = "flex";

      },800);

    },500);
  }

},50);


/* BUTTONS */

function playGame(){

  alert("Dli World Game is coming next...");

}

function login(){

  alert("Login / Register system will be added next.");

}

function profile(){

  alert("Player Profile will be added next.");

}

function leaderboard(){

  alert("Leaderboard will be added next.");

}

function settings(){

  alert("Game Settings will be added next.");

}

</script>

</body>
</html>
