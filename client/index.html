<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌆 Neon World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#060612;color:#fff;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;}
h1{font-size:2.5rem;background:linear-gradient(135deg,#ff2d78,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
p{color:#00d4ff;margin-top:16px;font-size:1rem;}
.dot{animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
</style>
</head>
<body>
<div>
<h1>🌆 NEON WORLD</h1>
<p>Server is running<span class="dot">...</span></p>
<p style="margin-top:8px;color:#00ff88;font-size:0.8rem;">✅ Online</p>
</div>
</body>
</html>
